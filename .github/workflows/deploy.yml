name: Build and deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Render manifests
        env:
          API_HOST: ${{ vars.API_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          # k8s.yaml starts with the Namespace, so apply creates it before the Secret below.
          {
            sed -e "s|IMAGE_PLACEHOLDER|${IMAGE}:${SHA}|" -e "s|DEPLOY_ID_PLACEHOLDER|\"${SHA}-${GITHUB_RUN_ID}\"|" \
                -e "s|HOST_PLACEHOLDER|${API_HOST}|g" k8s.yaml
            echo '---'
            kubectl create secret generic pmo --namespace pmo --dry-run=client -o yaml \
              --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              --from-literal=ADMIN_EMAILS="$ADMIN_EMAILS" \
              --from-literal=SMTP_HOST="$([ -n "$SMTP_PASSWORD" ] && echo "$SMTP_HOST")" \
              --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
              --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
              --from-literal=MAIL_FROM="$MAIL_FROM"
          } > rendered.yaml

      - name: Deploy to k3s
        run: |
          ssh debian@${{ secrets.VPS_HOST }} \
            'KUBECONFIG=$HOME/.kube/config kubectl apply -f - && KUBECONFIG=$HOME/.kube/config kubectl -n pmo rollout status deployment/api --timeout=180s' \
            < rendered.yaml
